name: estagent-assistant
services:
  assistant:
    image: ${ASSISTANT_IMAGE:?Set an accepted commit-specific ASSISTANT_IMAGE}
    pull_policy: never
    init: true
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ESTAGENT_KEYLESS_PREVIEW: ${ESTAGENT_KEYLESS_PREVIEW:-0}
      OPENAI_MODEL_VISION: ${OPENAI_MODEL_VISION:-gpt-6.1-sol}
      OPENAI_MODEL_TTS: ${OPENAI_MODEL_TTS:-gpt-4o-mini-tts}
      STUDIO_DATA_DIR: /data/studio
      STUDIO_GEOMETRY_URL: ${STUDIO_GEOMETRY_URL:-}
      STUDIO_GEOMETRY_TOKEN: ${STUDIO_GEOMETRY_TOKEN:-}
      MEDIA_STORAGE_BACKEND: ${MEDIA_STORAGE_BACKEND:-local}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_SECURE: ${MINIO_SECURE:-0}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-}
      OPENAI_MODEL_TEXT: ${OPENAI_MODEL_TEXT:?Set OPENAI_MODEL_TEXT}
      OPENAI_MODEL_REALTIME: ${OPENAI_MODEL_REALTIME:?Set OPENAI_MODEL_REALTIME}
      OPENAI_MODEL_TRANSCRIBE: ${OPENAI_MODEL_TRANSCRIBE:?Set OPENAI_MODEL_TRANSCRIBE}
      ASSISTANT_ORIGIN: ${ASSISTANT_ORIGIN:?Set the exact HTTPS frontend origin}
      ASSISTANT_REQUIRED_FIELDS: ${ASSISTANT_REQUIRED_FIELDS:?Set the accepted required-fields policy}
      ASSISTANT_DB: /data/checkpoints.sqlite
      API_LIMITS_ENABLED: ${API_LIMITS_ENABLED:-0}
      API_LIMITS_DB: /data/api-limits.sqlite
      API_LIMITS_AI_REQUESTS: ${API_LIMITS_AI_REQUESTS:-}
      API_LIMITS_AI_WINDOW_SECONDS: ${API_LIMITS_AI_WINDOW_SECONDS:-}
      API_LIMITS_AI_CONCURRENCY: ${API_LIMITS_AI_CONCURRENCY:-}
      API_LIMITS_AI_ATTEMPTS: ${API_LIMITS_AI_ATTEMPTS:-}
      API_LIMITS_AI_ATTEMPT_WINDOW_SECONDS: ${API_LIMITS_AI_ATTEMPT_WINDOW_SECONDS:-}
      API_LIMITS_UPLOAD_REQUESTS: ${API_LIMITS_UPLOAD_REQUESTS:-6}
      API_LIMITS_UPLOAD_WINDOW_SECONDS: ${API_LIMITS_UPLOAD_WINDOW_SECONDS:-60}
      API_LIMITS_UPLOAD_CONCURRENCY: ${API_LIMITS_UPLOAD_CONCURRENCY:-1}
      STORAGE_LIMITS_ENABLED: ${STORAGE_LIMITS_ENABLED:-0}
      STORAGE_LIMITS_ROOT: /data
      STORAGE_LIMITS_MAX_BYTES: ${STORAGE_LIMITS_MAX_BYTES:-}
      STORAGE_LIMITS_MIN_FREE_BYTES: ${STORAGE_LIMITS_MIN_FREE_BYTES:-}
    ports:
      - "127.0.0.1:18180:5180"
    volumes:
      - checkpoints:/data
    networks:
      storage: {}
      edge:
        aliases:
          - estagent-assistant-api
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  checkpoints:
    name: estagent-assistant-checkpoints
networks:
  edge:
    name: estagent-assistant-edge
  storage:
    name: estagent-object-store
    external: true
