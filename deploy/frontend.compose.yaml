name: estagent-web
services:
  frontend:
    image: ${ESTAGENT_WEB_IMAGE:?Set the inspected Caddy image ID or digest}
    pull_policy: never
    user: "10001:10001"
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    read_only: true
    volumes:
      - ${ESTAGENT_WEB_RELEASE:?Set the immutable release directory}/public:/srv:ro
      - ./frontend.Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      edge:
        aliases: [estagent-web]
    cap_drop: [ALL]
    # The upstream Caddy binary carries this file capability; allow its exec.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
networks:
  edge:
    name: estagent-web-edge
