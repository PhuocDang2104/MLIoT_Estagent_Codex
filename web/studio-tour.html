<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="/assets/favicon.svg" />
    <title>Explore the property — Estagent</title>
    <link rel="stylesheet" href="/assets/fonts.css" />
    <link rel="stylesheet" href="/studio.css" />
    <script type="module" src="/studio-tour.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/index.html"
        ><span class="brand-symbol" aria-hidden="true"></span>Estagent<span
          class="brand-dot"
          >.</span
        ></a
      ><span class="draft-pill">Published tour</span>
    </header>
    <main style="max-width: 1300px; margin: auto">
      <div
        id="notice"
        class="notice"
        role="status"
        aria-live="polite"
        hidden
      ></div>
      <h1 id="title">Opening tour…</h1>
      <div class="workspace-grid">
        <section class="panel">
          <div class="panel-title">
            <h2 id="room-label"></h2>
            <select id="room" aria-label="Choose a space to explore"></select>
          </div>
          <div class="tabs" aria-label="Tour view mode">
            <button id="show-panorama" aria-pressed="true">Panorama</button>
            <button id="show-model" aria-pressed="false">3D house</button>
          </div>
          <div id="preview" class="preview" style="aspect-ratio: 1.7"></div>
          <nav
            id="connections"
            aria-label="Go to a connected space"
            style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px"
          ></nav>
          <p id="room-description" class="muted"></p>
          <button id="play" disabled>Listen to introduction</button>
          <button id="pause">Pause</button
          ><label class="muted"
            >Background music
            <input
              id="music-volume"
              type="range"
              min="0"
              max="0.4"
              step="0.01"
              value="0.16"
              aria-label="Music volume" /></label
          ><label class="muted"
            >Introduction
            <input
              id="voice-volume"
              type="range"
              min="0"
              max="1"
              step="0.05"
              value="1"
              aria-label="Narration volume"
          /></label>
          <p id="subtitle"></p>
          <p class="muted">
            Narration is AI-generated. Drag the image or use the arrow keys to look around.
          </p>
          <a id="model-link">Download GLB model ↗</a>
        </section>
        <aside class="panel">
          <h2>Ask about this space</h2>
          <p class="muted">The assistant uses only approved tour information.</p>
          <div id="chat" role="log" aria-live="polite"></div>
          <form id="question-form">
            <label for="question" class="muted">Your question</label
            ><textarea
              id="question"
              rows="3"
              maxlength="1000"
              required
              placeholder="What are the features of this space?"
            ></textarea
            ><button class="primary" id="ask" style="margin-top: 12px" disabled>
              Ask Estagent ↗
            </button>
          </form>
          <p id="music-credit" class="muted"></p>
        </aside>
      </div>
    </main>
  </body>
</html>
